name: Release Windows Installer

on:
  push:
    tags:
      - "v*-windows.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.1.19-windows.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron Builder downloads
        uses: actions/cache@v4
        with:
          path: .electron-builder-cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install server and packager dependencies
        run: npm install

      - name: Install UI dependencies
        run: npm install --legacy-peer-deps --prefix ui

      - name: Build installer
        run: npm run dist:win

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "camera.ui Setup *.exe" | Select-Object -First 1

          if (!$installer) {
            throw "Windows installer was not found in dist"
          }

          $assets = @($installer.FullName)
          $blockmap = "$($installer.FullName).blockmap"

          if (Test-Path $blockmap) {
            $assets += $blockmap
          }

          if (Test-Path "dist/latest.yml") {
            $assets += "dist/latest.yml"
          }

          $notes = @"
          Windows installer for camera.ui.

          Download and run `$($installer.Name)`.

          This installer includes the desktop runtime, camera.ui server, built web interface, and ffmpeg. The target PC does not need Node.js or npm.
          "@

          gh release create "$env:RELEASE_TAG" @assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "camera.ui Windows Installer $env:RELEASE_TAG" `
            --notes "$notes"
